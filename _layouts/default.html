<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/thaw-icon.png' | relative_url }}">
  <style>
    :root {
      --bg: #f2f5f8; --card: #ffffff; --text: #1c2630; --muted: #5d6b78; --line: #dde5ec; --accent: #2a74ab;
      --button: #1c2630; --button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1418; --card: #162028; --text: #e7eef3; --muted: #9aabb8; --line: #25323c; --accent: #7cc0ea;
        --button: #e7eef3; --button-text: #0d1418;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow-wrap: break-word;
    }
    a { color: var(--accent); text-underline-offset: 2px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

    header.site { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 20px; padding-bottom: 20px; }
    header.site .home { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
    header.site .home img { width: 34px; height: 34px; border-radius: 22.4%; }
    header.site .home span { font: 700 19px/1 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
    header.site nav { margin-left: auto; display: flex; gap: 18px; font-size: 15px; }
    header.site nav a { color: var(--muted); text-decoration: none; }
    header.site nav a:hover { color: var(--text); }
    header.site nav a[aria-current="page"] { color: var(--text); font-weight: 600; }

    /* Text pages: one card, like an iOS grouped list. */
    article { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 28px 24px; }
    h1 { font: 700 32px/1.15 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; margin: 20px 0 6px; letter-spacing: -0.01em; }
    h2 { font-size: 19px; line-height: 1.3; margin: 32px 0 6px; }
    h3 { font-size: 17px; margin: 22px 0 4px; }
    p { margin: 10px 0; }
    ul, ol { padding-left: 1.3em; margin: 10px 0; }
    li { margin: 6px 0; }
    li > ul, li > ol { margin: 4px 0; }
    .updated { color: var(--muted); font-size: 15px; margin-top: 0; }
    .summary { background: var(--bg); border-radius: 14px; padding: 14px 18px; margin: 18px 0 8px; }
    .summary p { margin: 6px 0; }

    /* Front page. */
    .hero { text-align: center; padding: 40px 0 24px; }
    .hero img { width: 136px; height: 136px; border-radius: 22.4%; box-shadow: 0 10px 30px rgba(20, 60, 100, .18); }
    .hero h1 { font-size: 40px; line-height: 1.1; max-width: 13em; margin: 28px auto 14px; }
    .hero .lead { font-size: 20px; line-height: 1.45; color: var(--muted); max-width: 26em; margin: 0 auto; }
    .store {
      display: inline-block; margin-top: 30px; padding: 13px 26px; border-radius: 999px;
      background: var(--button); color: var(--button-text); font-weight: 600; font-size: 17px; text-decoration: none;
    }
    .store.soon { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
    .hero .meta { color: var(--muted); font-size: 15px; margin-top: 14px; }
    .contact { text-align: center; color: var(--muted); font-size: 16px; margin: 28px 0 0; }

    footer.site { color: var(--muted); font-size: 14px; padding-top: 28px; padding-bottom: 44px; }
    body.home footer.site { text-align: center; }

    @media (max-width: 600px) {
      body { font-size: 16.5px; }
      .wrap { padding: 0 16px; }
      article { padding: 6px 18px 20px; border-radius: 18px; }
      h1 { font-size: 28px; }
      .hero { padding-top: 28px; }
      .hero img { width: 112px; height: 112px; }
      .hero h1 { font-size: 32px; }
      .hero .lead { font-size: 18px; }
    }
  </style>
</head>
<body class="{{ page.kind | default: 'page' }}">
  <header class="site wrap">
    <a class="home" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/thaw-icon.png' | relative_url }}" alt="">
      <span>Ice Tray</span>
    </a>
    <nav aria-label="Pages">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms/' | relative_url }}"{% if page.url == '/terms/' %} aria-current="page"{% endif %}>Terms</a>
    </nav>
  </header>
  <main class="wrap">
{% if page.kind == 'home' %}
{{ content }}
{% else %}
    <article>
{{ content }}
    </article>
{% endif %}
  </main>
  <footer class="site wrap">
    © {{ site.time | date: '%Y' }} AppHazard Studios
  </footer>
</body>
</html>

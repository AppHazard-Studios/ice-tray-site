<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/thaw-icon.png' | relative_url }}">
  <style>
    :root {
      --bg: #f2f6f9; --card: #ffffff; --text: #1c2630; --muted: #5d6b78; --line: #dde5ec; --accent: #2f7fb8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1418; --card: #162028; --text: #e7eef3; --muted: #9aabb8; --line: #25323c; --accent: #7cc0ea; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    header, main, footer { max-width: 680px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 12px; padding-top: 28px; }
    header a.home { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; }
    header img { width: 44px; height: 44px; border-radius: 22.4%; }
    header .name { font: 600 22px/1.2 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
    nav { margin-left: auto; display: flex; gap: 14px; font-size: 15px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a[aria-current="page"] { color: var(--text); font-weight: 600; }
    main { margin-top: 20px; }
    article { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 8px 24px 20px; }
    h1 { font: 700 30px/1.2 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; margin: 20px 0 8px; }
    h2 { font-size: 20px; margin: 28px 0 6px; }
    h3 { font-size: 17px; margin: 20px 0 4px; }
    a { color: var(--accent); }
    ul, ol { padding-left: 1.3em; }
    li { margin: 4px 0; }
    em { color: var(--muted); }
    .hero { text-align: center; padding: 16px 0 4px; }
    .hero img { width: 112px; height: 112px; border-radius: 22.4%; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .hero p { font-size: 20px; margin: 12px 0 0; }
    footer { color: var(--muted); font-size: 14px; padding-top: 18px; padding-bottom: 40px; }
    @media (max-width: 480px) {
      header { flex-wrap: wrap; }
      nav { margin-left: 0; width: 100%; }
      article { padding: 4px 16px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/thaw-icon.png' | relative_url }}" alt="">
      <span class="name">Thaw</span>
    </a>
    <nav aria-label="Pages">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms/' | relative_url }}"{% if page.url == '/terms/' %} aria-current="page"{% endif %}>Terms</a>
    </nav>
  </header>
  <main>
    <article>
{{ content }}
    </article>
  </main>
  <footer>
    © {{ site.time | date: '%Y' }} AppHazard Studios · <a href="mailto:apphazardstudios@gmail.com">apphazardstudios@gmail.com</a><br>
    This site has no cookies and no analytics.
  </footer>
</body>
</html>
